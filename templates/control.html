<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WifiSense Director</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .scene-btn { transition: transform .12s ease, box-shadow .2s ease; }
    .scene-btn:active { transform: scale(.94); }
</style>
</head>
<body class="min-h-screen bg-[#0B0E0C] px-5 py-6 text-stone-100">

<div class="mx-auto flex max-w-sm flex-col gap-4">

    <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
            <span class="h-6 w-6 rounded-full bg-emerald-600/80"></span>
            <p class="text-lg font-bold tracking-tight">Director</p>
        </div>
        <span id="feedChip" class="rounded-full bg-stone-800 px-3 py-1 text-[11px] font-semibold uppercase tracking-widest text-stone-400">…</span>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/[0.04] p-4 text-center">
        <p class="text-[11px] font-semibold uppercase tracking-widest text-stone-400">On screen now</p>
        <p id="stateLabel" class="mt-1 text-2xl font-bold tracking-tight">—</p>
        <div class="mt-3 flex items-center justify-center gap-2 text-xs text-stone-400">
            <span id="awayDot" class="h-2 w-2 rounded-full bg-stone-600"></span>
            <span id="awayText">Away disarmed</span>
        </div>
    </div>

    <button data-state="" id="btnAuto"
        class="scene-btn rounded-2xl border border-emerald-500/40 bg-emerald-500/10 px-5 py-4 text-left">
        <span class="block text-base font-bold">Follow live feed</span>
        <span class="block text-xs text-stone-400">Release manual control</span>
    </button>

    <div class="grid grid-cols-2 gap-3">
        <button data-state="0"
            class="scene-btn rounded-2xl border border-stone-700 bg-stone-900 px-4 py-5 text-center">
            <span class="block text-lg font-bold">Empty</span>
            <span class="block text-[11px] text-stone-500">eco shutdown</span>
        </button>
        <button data-state="1"
            class="scene-btn rounded-2xl border border-amber-600/50 bg-amber-500/15 px-4 py-5 text-center">
            <span class="block text-lg font-bold">Moving</span>
            <span class="block text-[11px] text-amber-300/70">activity on</span>
        </button>
        <button data-state="2"
            class="scene-btn rounded-2xl border border-blue-600/50 bg-blue-500/15 px-4 py-5 text-center">
            <span class="block text-lg font-bold">Sleeping</span>
            <span class="block text-[11px] text-blue-300/70">vitals lock-on</span>
        </button>
        <button id="btnIntruder"
            class="scene-btn rounded-2xl border border-red-600/60 bg-red-500/20 px-4 py-5 text-center">
            <span class="block text-lg font-bold text-red-300">Intruder</span>
            <span class="block text-[11px] text-red-300/70">motion + away armed</span>
        </button>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-4">
        <p class="mb-2 text-[11px] font-semibold uppercase tracking-widest text-stone-400">Headcount (approx)</p>
        <div class="grid grid-cols-4 gap-2">
            <button data-count="" class="count-btn scene-btn rounded-xl border border-emerald-500/40 bg-emerald-500/10 py-3 text-sm font-bold">Auto</button>
            <button data-count="4" class="count-btn scene-btn rounded-xl border border-stone-700 bg-stone-900 py-3 text-base font-bold">4</button>
            <button data-count="5" class="count-btn scene-btn rounded-xl border border-stone-700 bg-stone-900 py-3 text-base font-bold">5</button>
            <button data-count="6" class="count-btn scene-btn rounded-xl border border-stone-700 bg-stone-900 py-3 text-base font-bold">6</button>
        </div>
        <p id="peopleNow" class="mt-2 text-center text-[11px] text-stone-500">showing ≈5</p>
    </div>

    <div class="rounded-2xl border border-white/10 bg-white/[0.04] px-4 py-4">
        <p class="mb-3 text-[11px] font-semibold uppercase tracking-widest text-stone-400">Eco devices</p>

        <div class="flex items-center justify-between gap-2 pb-3">
            <div class="flex items-center gap-2 text-sm font-semibold">
                HVAC
                <span id="hvacModeChip" class="cursor-pointer rounded bg-emerald-500/10 px-1.5 py-0.5 text-[10px] uppercase tracking-wider text-emerald-400" title="Click to restore Auto">Auto</span>
            </div>
            <div class="flex items-center gap-2">
                <button id="hvacMinus" class="scene-btn h-9 w-9 rounded-full border border-stone-700 bg-stone-900 text-lg leading-none">−</button>
                <span id="hvacTemp" class="w-11 text-center text-base font-bold tabular-nums">22°</span>
                <button id="hvacPlus" class="scene-btn h-9 w-9 rounded-full border border-stone-700 bg-stone-900 text-lg leading-none">+</button>
                <label class="relative h-7 w-12 shrink-0 cursor-pointer">
                    <input type="checkbox" id="hvacPower" class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-stone-700 transition-colors after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-all peer-checked:bg-emerald-500 peer-checked:after:translate-x-5"></span>
                </label>
            </div>
        </div>

        <div class="flex items-center justify-between gap-3 border-t border-white/10 pt-3">
            <div class="flex items-center gap-2 text-sm font-semibold">
                Lights
                <span id="lightingModeChip" class="cursor-pointer rounded bg-emerald-500/10 px-1.5 py-0.5 text-[10px] uppercase tracking-wider text-emerald-400" title="Click to restore Auto">Auto</span>
            </div>
            <div class="flex flex-1 items-center gap-2">
                <input type="range" id="lightSlider" min="5" max="100" value="80" class="w-full accent-emerald-400">
                <span id="lightVal" class="w-10 text-right text-sm font-bold tabular-nums">80%</span>
                <label class="relative h-7 w-12 shrink-0 cursor-pointer">
                    <input type="checkbox" id="lightPower" class="peer sr-only">
                    <span class="absolute inset-0 rounded-full bg-stone-700 transition-colors after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-all peer-checked:bg-emerald-500 peer-checked:after:translate-x-5"></span>
                </label>
            </div>
        </div>
    </div>

    <label class="flex cursor-pointer items-center justify-between rounded-2xl border border-white/10 bg-white/[0.04] px-5 py-4">
        <span>
            <span class="block text-sm font-semibold">Away Mode</span>
            <span class="block text-xs text-stone-500">arms intrusion alerts</span>
        </span>
        <input type="checkbox" id="awayToggle" class="peer sr-only">
        <span class="relative h-7 w-12 rounded-full bg-stone-700 transition-colors after:absolute after:left-1 after:top-1 after:h-5 after:w-5 after:rounded-full after:bg-white after:transition-all peer-checked:bg-red-600 peer-checked:after:translate-x-5"></span>
    </label>

    <p class="pb-4 text-center text-[11px] leading-relaxed text-stone-600">
        Scenes override the live ESP32 feed until you press Follow.
        Activity log entries look organic either way.
    </p>
</div>

<script>
    const stateNames = { 0: 'Empty', 1: 'Moving', 2: 'Sleeping' };
    const stateColors = {
        0: 'text-stone-200',
        1: 'text-amber-400',
        2: 'text-blue-400',
    };

    let overrideState = undefined; // undefined until first snapshot
    let awayArmed = false;

    function render() {
        const label = document.getElementById('stateLabel');
        if (overrideState === null || overrideState === undefined) {
            label.textContent = 'Live feed';
            label.className = 'mt-1 text-2xl font-bold tracking-tight text-emerald-400';
        } else {
            const s = Number(overrideState);
            label.textContent = 'Forced: ' + (stateNames[s] ?? s);
            label.className = 'mt-1 text-2xl font-bold tracking-tight ' + (stateColors[s] ?? '');
        }

        document.querySelectorAll('button[data-state]').forEach(b => {
            const active = String(overrideState ?? '') === b.dataset.state;
            b.classList.toggle('ring-2', active);
            b.classList.toggle('ring-emerald-400', active && b.dataset.state !== '');
            b.classList.toggle('ring-white/60', active && b.dataset.state === '');
        });

        document.getElementById('awayDot').className =
            'h-2 w-2 rounded-full ' + (awayArmed ? 'bg-red-500 animate-pulse' : 'bg-stone-600');
        document.getElementById('awayText').textContent =
            awayArmed ? 'Away ARMED — motion triggers alert' : 'Away disarmed';
        document.getElementById('awayToggle').checked = awayArmed;
    }

    async function post(url, body) {
        await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                           body: JSON.stringify(body || {}) });
    }

    document.querySelectorAll('button[data-state]').forEach(b =>
        b.addEventListener('click', () => {
            overrideState = b.dataset.state === '' ? null : Number(b.dataset.state);
            post('/api/override', { state: b.dataset.state === '' ? null : Number(b.dataset.state) });
            render();
        }));

    document.getElementById('btnIntruder').addEventListener('click', () => {
        overrideState = 1;
        awayArmed = true;
        post('/api/override', { state: 1, arm_away: true });
        render();
    });

    document.querySelectorAll('button[data-count]').forEach(b =>
        b.addEventListener('click', () => {
            const v = b.dataset.count === '' ? null : Number(b.dataset.count);
            post('/api/people', { count: v });
        }));

    function renderPeople(n) {
        document.getElementById('peopleNow').textContent = 'showing ≈' + n;
    }

    // ---- Eco device controls ----
    const hvacTemp = document.getElementById('hvacTemp');
    const lightSlider = document.getElementById('lightSlider');
    const lightVal = document.getElementById('lightVal');

    function autoChip(el, isAuto) {
        if (!el) return;
        el.textContent = isAuto ? 'Auto' : 'Manual';
        el.className = 'cursor-pointer rounded px-1.5 py-0.5 text-[10px] uppercase tracking-wider ' + 
            (isAuto ? 'bg-emerald-500/10 text-emerald-400' : 'bg-stone-500/10 text-stone-400');
        el.title = isAuto ? '' : 'Click to restore Auto';
    }

    function renderDevice(name, device) {
        if (!device) return;
        if (name === 'hvac') {
            hvacTemp.textContent = device.temp + '°';
            document.getElementById('hvacPower').checked = !!device.on;
            autoChip(document.getElementById('hvacModeChip'), device.mode === 'auto');
        } else if (name === 'lighting') {
            lightSlider.value = device.brightness;
            lightVal.textContent = device.brightness + '%';
            lightSlider.disabled = !device.on;
            document.getElementById('lightPower').checked = !!device.on;
            autoChip(document.getElementById('lightingModeChip'), device.mode === 'auto');
        }
    }

    async function postDev(url, body) {
        try { await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                 body: JSON.stringify(body) }); } catch (e) {}
    }

    document.getElementById('hvacPower').addEventListener('change', e => postDev('/api/devices/hvac', { on: e.target.checked }));
    document.getElementById('lightPower').addEventListener('change', e => postDev('/api/devices/lighting', { on: e.target.checked }));
    lightSlider.addEventListener('change', () => postDev('/api/devices/lighting', { brightness: +lightSlider.value }));
    document.getElementById('hvacMinus').addEventListener('click', () => postDev('/api/devices/hvac', { temp: parseInt(hvacTemp.textContent) - 1 }));
    document.getElementById('hvacPlus').addEventListener('click', () => postDev('/api/devices/hvac', { temp: parseInt(hvacTemp.textContent) + 1 }));
    document.getElementById('hvacModeChip')?.addEventListener('click', () => { if(document.getElementById('hvacModeChip').textContent === 'Manual') post('/api/devices/hvac/auto', {}); });
    document.getElementById('lightingModeChip')?.addEventListener('click', () => { if(document.getElementById('lightingModeChip').textContent === 'Manual') post('/api/devices/lighting/auto', {}); });

    document.getElementById('awayToggle').addEventListener('change', e => {
        awayArmed = e.target.checked;
        if (!awayArmed && overrideState === 1) {
            overrideState = null;
            post('/api/override', { state: null });
        }
        post('/api/away', { enabled: awayArmed });
        render();
    });

    function setFeed(feed, ovr) {
        const chip = document.getElementById('feedChip');
        let text, cls;
        if (ovr !== null && ovr !== undefined) {
            text = 'directed';
            cls = 'bg-violet-500/20 text-violet-300';
        } else if (feed === 'live') {
            text = 'live esp32';
            cls = 'bg-emerald-500/15 text-emerald-400';
        } else {
            text = 'simulated';
            cls = 'bg-amber-500/15 text-amber-400';
        }
        chip.textContent = text;
        chip.className = 'rounded-full px-3 py-1 text-[11px] font-semibold uppercase tracking-widest ' + cls;
    }

    const socket = io();
    socket.on('initial_state', d => {
        overrideState = d.override ? d.override.state : null;
        awayArmed = !!(d.away_mode && d.away_mode.enabled);
        setFeed(d.source ? d.source.feed : 'live', overrideState);
        renderPeople(d.people ?? 5);
        Object.entries(d.devices || {}).forEach(([n, dev]) => renderDevice(n, dev));
        render();
    });
    socket.on('override_update', d => { overrideState = d.state; render(); });
    socket.on('people_update', d => renderPeople(d.count));
    socket.on('device_update', ({ name, device }) => renderDevice(name, device));
    socket.on('away_update', d => { awayArmed = !!d.enabled; render(); });
    socket.on('connect', () => fetch('/api/state').then(r => r.json()).then(d => {
        overrideState = d.override ? d.override.state : null;
        awayArmed = !!(d.away_mode && d.away_mode.enabled);
        setFeed(d.source ? d.source.feed : 'live', overrideState);
        renderPeople(d.people ?? 5);
        Object.entries(d.devices || {}).forEach(([n, dev]) => renderDevice(n, dev));
        render();
    }).catch(() => {}));

    render();
</script>
</body>
</html>
